name: Ruff

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync

    - name: Lint with ruff
      run: uv run ruff check
